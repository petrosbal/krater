workload:
  language: c
  source: src/bench.c

build:
  optimization_level: 3

targets:
  - name: debian
    code_format: native
    link_mode: dynamic

  - name: static
    code_format: native
    link_mode: static

  - name: wasm
    code_format: wasm

  - name: wasm-aot
    code_format: wasm
    aot_compiler: wasmedge
