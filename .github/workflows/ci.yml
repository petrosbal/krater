name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements-dev.txt

      - name: Run ruff
        run: ruff check src/ --ignore E701

      - name: Run pytest
        run: make test

      - name: Run shellcheck
        run:
          shellcheck scripts/*.sh

      - name: Install SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y swi-prolog-nox

      - name: Check the Prolog
        run: bash scripts/check-prolog.sh

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: dice/generated/Dockerfile
          # DL3059 flags consecutive RUNs because each is a layer that ships.
          # Every RUN here is in a builder stage whose layers are discarded.
          ignore: DL3059
