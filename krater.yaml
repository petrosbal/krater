# every key is described in docs/CONFIGURATION.md
build:
  workload:
    language: c
    source: workloads/matmul/matmul.c
    optimization_level: 3

  targets:
    - name: native
      code_format: native
      link_mode: dynamic

    - name: native-static
      code_format: native
      link_mode: static

    - name: wasm
      code_format: wasm

    - name: wasm-aot
      code_format: wasm
      aot_compiler: wasmedge

run:
  runtimes: [default, wasmtime, wasmedge, wasmer]
  params:
    size: [256, 1024]
  trials: 30
  duration: 60
  warmup: 10
  timeout: 120
  interval: 0.2
  namespace: default
  cpu: "1000m"
  memory: "1024Mi"
  name: benchmark_1
